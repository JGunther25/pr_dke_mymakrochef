spring.application.name=mymakrochef

allowed.origins=http://localhost:5173

spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?currentSchema=rezeptplaner&prepareThreshold=0
spring.datasource.username=postgres.ejrziftufyrvnyopcuby
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
